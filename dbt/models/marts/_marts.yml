version: 2

models:
  # ── Dimensions ────────────────────────────────────────────────────────────────

  - name: dim_customers
    description: >
      One row per unique customer (customer_unique_id). Deduped from the
      order-scoped stg_customers. Use customer_unique_id — not customer_id —
      for cohort, retention, and repeat-purchase analysis.
      NOTE: repeat-purchase rate in this dataset is ~3 %; that is real signal.
    columns:
      - name: customer_unique_id
        description: Stable person-level customer key.
        tests:
          - not_null
          - unique
      - name: zip_code_prefix
        description: 5-digit zip prefix of the customer's address.
      - name: customer_city
        description: City of the customer (lowercased, trimmed).
      - name: customer_state
        description: Two-letter Brazilian state code.
        tests:
          - not_null

  - name: dim_products
    description: >
      One row per product. Joins the Portuguese category name to its English
      translation; falls back to the Portuguese name if no translation exists
      (~600 products have no category at all).
    columns:
      - name: product_id
        description: Unique product identifier.
        tests:
          - not_null
          - unique
      - name: product_category_name
        description: Portuguese product category name. Null for uncategorised products.
      - name: product_category_name_english
        description: >
          English translation of the category. Falls back to the Portuguese name
          when a translation is unavailable.
      - name: product_weight_g
        description: Product weight in grams; used in freight-cost analysis.
      - name: product_length_cm
        description: Product length in centimetres.
      - name: product_height_cm
        description: Product height in centimetres.
      - name: product_width_cm
        description: Product width in centimetres.

  - name: dim_sellers
    description: >
      One row per seller with location data and lat/lng from stg_geolocation.
      Lat/lng is null for sellers whose zip prefix is not in the geolocation table.
    columns:
      - name: seller_id
        description: Unique seller identifier.
        tests:
          - not_null
          - unique
      - name: zip_code_prefix
        description: 5-digit zip prefix of the seller's address.
        tests:
          - not_null
      - name: seller_city
        description: City of the seller (lowercased, trimmed).
      - name: seller_state
        description: Two-letter Brazilian state code.
        tests:
          - not_null
      - name: latitude
        description: Average latitude for the seller's zip prefix.
      - name: longitude
        description: Average longitude for the seller's zip prefix.

  # ── Facts ─────────────────────────────────────────────────────────────────────

  - name: fct_orders
    description: >
      One row per order. Combines delivery metrics from int_orders_enriched with
      payment and item aggregates. The primary fact table for GMV, delivery,
      and customer-level analysis.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 90000
          max_value: 110000
      - dbt_utils.expression_is_true:
          expression: "order_value >= 0"
      - dbt_utils.expression_is_true:
          expression: "item_count >= 0"
    columns:
      - name: order_id
        description: Unique order identifier.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Order-scoped customer key; join to stg_customers for customer_unique_id.
        tests:
          - not_null
      - name: order_status
        description: Current lifecycle status of the order.
        tests:
          - not_null
      - name: purchased_at
        description: Timestamp when the order was placed.
        tests:
          - not_null
      - name: delivery_days
        description: Calendar days from purchase to customer receipt. Null if not delivered.
      - name: estimated_vs_actual_days
        description: Days early (positive) or late (negative) vs estimated delivery date.
      - name: is_late
        description: True if the order was delivered past its estimated date.
      - name: order_value
        description: Total payment value in BRL (sum of all payment entries for the order).
        tests:
          - not_null
      - name: item_count
        description: Number of line items in the order.
        tests:
          - not_null
      - name: items_value
        description: Sum of item prices (excluding freight) in BRL.
        tests:
          - not_null
      - name: total_freight
        description: Total freight cost in BRL across all items in the order.
        tests:
          - not_null
      - name: _loaded_date
        description: Batch watermark; first day of the purchase month.

  - name: fct_order_items
    description: >
      One row per order line item. Incremental model — merges new monthly batches
      using _loaded_date as the watermark. Use for product- and seller-level analysis.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, order_item_id]
      - dbt_utils.expression_is_true:
          expression: "abs(item_total - (price + freight_value)) < 0.01"
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 100000
          max_value: 125000
    config:
      materialized: incremental
      unique_key:
        - order_id
        - order_item_id
      incremental_strategy: merge
    columns:
      - name: order_id
        description: Foreign key to fct_orders.
        tests:
          - not_null
      - name: order_item_id
        description: Sequential item number within the order (1-based).
        tests:
          - not_null
      - name: product_id
        description: Foreign key to dim_products.
        tests:
          - not_null
      - name: seller_id
        description: Foreign key to dim_sellers.
        tests:
          - not_null
      - name: customer_id
        description: Order-scoped customer key (denormalised from the order).
        tests:
          - not_null
      - name: price
        description: Item price in BRL.
        tests:
          - not_null
      - name: freight_value
        description: Freight cost in BRL for this item.
        tests:
          - not_null
      - name: item_total
        description: price + freight_value.
        tests:
          - not_null
      - name: _loaded_date
        description: Batch watermark; first day of the purchase month.

  # ── Marts ─────────────────────────────────────────────────────────────────────

  - name: mart_gmv_daily
    description: >
      Grain: (order_date, product_category_name_english). One row per category
      per day for non-canceled orders. daily_gmv / daily_order_count / daily_aov
      are repeated on every category row so a BI tool can compute category share
      (category_gmv / daily_gmv) without a self-join.
      Excludes 'canceled' and 'unavailable' orders.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_date, product_category]
    columns:
      - name: order_date
        description: Calendar date of purchase (truncated from purchased_at).
        tests:
          - not_null
      - name: product_category
        description: >
          English product category. 'uncategorized' where the category is null.
        tests:
          - not_null
      - name: order_count
        description: >
          Distinct orders containing at least one item in this category on this day.
          Note: an order spanning multiple categories is counted once per category.
        tests:
          - not_null
      - name: item_count
        description: Number of individual line items in this category on this day.
        tests:
          - not_null
      - name: category_gmv
        description: Sum of item_total (price + freight) for this category and day in BRL.
        tests:
          - not_null
      - name: daily_order_count
        description: Total distinct orders on this day (all categories, from fct_orders).
        tests:
          - not_null
      - name: daily_gmv
        description: >
          Total GMV on this day in BRL, computed from actual payment amounts (order_value).
          Use this as the headline GMV figure — it differs slightly from sum(category_gmv)
          because category_gmv uses item_total while daily_gmv uses payment totals.
        tests:
          - not_null
      - name: daily_aov
        description: daily_gmv / daily_order_count — average order value for the day in BRL.
        tests:
          - not_null
      - name: category_gmv_share
        description: category_gmv / sum(category_gmv for the day) — this category's share of daily item GMV.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true

  - name: mart_delivery_performance
    description: >
      Grain: (order_month, customer_state). Delivery KPIs for completed
      (status = 'delivered') orders only, grouped by the customer's Brazilian
      state and the month of purchase. Orders without a recorded delivery date
      are excluded so rates are not diluted by in-transit or canceled orders.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_month, customer_state]
    columns:
      - name: order_month
        description: First day of the purchase month (DATE).
        tests:
          - not_null
      - name: customer_state
        description: Two-letter Brazilian state code of the customer.
        tests:
          - not_null
      - name: delivered_orders
        description: Count of delivered orders in this state-month.
        tests:
          - not_null
      - name: late_orders
        description: Orders where delivered_to_customer_at > estimated_delivery_date.
        tests:
          - not_null
      - name: late_delivery_rate
        description: late_orders / delivered_orders. Range 0–1.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
      - name: avg_delivery_days
        description: Average calendar days from purchase to customer receipt.
        tests:
          - not_null
      - name: avg_days_early
        description: >
          Average of estimated_vs_actual_days. Positive = delivered early on average;
          negative = delivered late on average.
        tests:
          - not_null

  - name: mart_customer_cohorts
    description: >
      Grain: (cohort_month, order_month). Classic monthly acquisition-cohort
      retention table. cohort_month is the customer's first purchase month;
      order_month is any subsequent month with a purchase.
      periods_since_acquisition = 0 is the acquisition month (retention = 100 %).
      Repeat-purchase rate in this dataset is ~3 %: most rows at period > 0
      will show very low active_customers — this is expected signal, not a bug.
      Excludes canceled and unavailable orders.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cohort_month, order_month]
    columns:
      - name: cohort_month
        description: First day of the month in which the customer first purchased (DATE).
        tests:
          - not_null
      - name: order_month
        description: First day of the month in which the cohort customers purchased again.
        tests:
          - not_null
      - name: periods_since_acquisition
        description: >
          Months between cohort_month and order_month. 0 = acquisition month.
          Use this as the x-axis on a cohort retention chart.
        tests:
          - not_null
      - name: cohort_size
        description: Total distinct customers acquired in cohort_month.
        tests:
          - not_null
      - name: active_customers
        description: >
          Customers from this cohort who placed at least one order in order_month.
        tests:
          - not_null
      - name: retention_rate
        description: active_customers / cohort_size. Range 0–1.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
