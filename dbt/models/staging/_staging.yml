version: 2

models:
  - name: stg_orders
    description: >
      One row per order. Timestamps renamed with _at suffix; _loaded_date
      retained as the batch-load watermark for downstream incremental models.
    columns:
      - name: order_id
        description: Unique order identifier (UUID).
        tests:
          - not_null
          - unique
      - name: customer_id
        description: >
          Order-scoped customer key. Joins to stg_customers. Note: the same
          person may have multiple customer_id values — use customer_unique_id
          for cohort and retention analysis.
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        description: Current lifecycle status of the order.
        tests:
          - not_null
          - accepted_values:
              values:
                - created
                - approved
                - invoiced
                - processing
                - shipped
                - delivered
                - unavailable
                - canceled
      - name: purchased_at
        description: Timestamp when the customer placed the order.
        tests:
          - not_null
      - name: approved_at
        description: Timestamp when payment was approved. Null for some statuses.
      - name: delivered_to_carrier_at
        description: Timestamp when the order was handed to the carrier.
      - name: delivered_to_customer_at
        description: Timestamp when the customer received the order.
      - name: estimated_delivery_date
        description: Seller-promised delivery date at time of purchase.
        tests:
          - not_null
      - name: _loaded_date
        description: >
          First day of the purchase month; added during ingestion to simulate
          incremental batch loads. Used as the incremental watermark in
          fct_order_items.

  - name: stg_order_items
    description: >
      One row per line item per order. An order may contain multiple items,
      each with its own seller, product, price, and freight.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        description: Foreign key to stg_orders.
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        description: Sequential item number within the order (1-based).
        tests:
          - not_null
      - name: product_id
        description: Foreign key to stg_products.
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        description: Foreign key to stg_sellers.
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      - name: shipping_limit_at
        description: Deadline by which the seller must ship the item.
      - name: price
        description: Item price in BRL, excluding freight.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: freight_value
        description: Freight cost in BRL for this item.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: stg_order_payments
    description: >
      One row per payment entry. A single order may be split across multiple
      payment types (e.g. credit card + voucher), giving multiple rows per order.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        description: Foreign key to stg_orders.
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_sequential
        description: Sequence number of this payment within the order (1-based).
        tests:
          - not_null
      - name: payment_type
        description: Payment method used.
        tests:
          - not_null
          - accepted_values:
              values:
                - credit_card
                - boleto
                - voucher
                - debit_card
                - not_defined
      - name: payment_installments
        description: Number of installments chosen by the customer.
      - name: payment_value
        description: Value of this payment entry in BRL.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: stg_order_reviews
    description: >
      One row per customer review. Most reviews lack a text comment; review_score
      is the primary signal (1–5 stars).
    columns:
      - name: review_id
        description: Unique review identifier (UUID).
        tests:
          - not_null
          - unique
      - name: order_id
        description: Foreign key to stg_orders.
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: review_score
        description: Star rating given by the customer (1 = worst, 5 = best).
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
          - dbt_expectations.expect_column_mean_to_be_between:
              min_value: 3.5
              max_value: 4.5
      - name: review_comment_title
        description: Optional short title left by the customer. Null if not provided.
      - name: review_comment_message
        description: Optional free-text review body. Null if not provided.
      - name: review_created_at
        description: Timestamp when the review form was sent to the customer.
      - name: review_answered_at
        description: Timestamp when the customer submitted the review.

  - name: stg_customers
    description: >
      One row per customer_id (order-scoped key). customer_unique_id is the
      stable person-level key — use it for cohort and repeat-purchase analysis.
      Repeat-purchase rate is ~3 %; that is a real property of this dataset.
    columns:
      - name: customer_id
        description: Order-scoped customer key (unique per order, not per person).
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: >
          Person-level customer key. Use this for retention and cohort analysis.
          A single unique customer may have multiple customer_id values.
        tests:
          - not_null
      - name: zip_code_prefix
        description: 5-digit zip code prefix for the customer's address.
        tests:
          - not_null
      - name: customer_city
        description: City of the customer, lowercased and trimmed.
      - name: customer_state
        description: Two-letter Brazilian state code.
        tests:
          - not_null

  - name: stg_products
    description: >
      One row per product. Physical dimensions are useful for freight-cost
      analysis. Category names are in Portuguese — joined to English in
      dim_products via the translation table.
    columns:
      - name: product_id
        description: Unique product identifier (UUID).
        tests:
          - not_null
          - unique
      - name: product_category_name
        description: Portuguese product category name. Null for ~600 products.
      - name: product_name_length
        description: Character length of the product name (corrected from source typo).
      - name: product_description_length
        description: Character length of the product description (corrected from source typo).
      - name: product_photos_qty
        description: Number of product photos.
      - name: product_weight_g
        description: Product weight in grams.
      - name: product_length_cm
        description: Product length in centimetres.
      - name: product_height_cm
        description: Product height in centimetres.
      - name: product_width_cm
        description: Product width in centimetres.

  - name: stg_sellers
    description: One row per seller, with location data.
    columns:
      - name: seller_id
        description: Unique seller identifier (UUID).
        tests:
          - not_null
          - unique
      - name: zip_code_prefix
        description: 5-digit zip code prefix for the seller's address.
        tests:
          - not_null
      - name: seller_city
        description: City of the seller, lowercased and trimmed.
      - name: seller_state
        description: Two-letter Brazilian state code.
        tests:
          - not_null

  - name: stg_geolocation
    description: >
      One row per zip code prefix (deduped from ~1 M source rows).
      Latitude and longitude are averaged across all entries for the prefix.
      NOTE: the source data contains ~8-9 rows with invalid GPS coordinates
      (lat up to 42°, lng up to 121°) — a known data quality issue in the
      Olist dataset that is out of scope to fix at the staging layer.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 15000
          max_value: 22000
    columns:
      - name: zip_code_prefix
        description: 5-digit Brazilian zip code prefix.
        tests:
          - not_null
          - unique
      - name: latitude
        description: >
          Average latitude for this zip code prefix.
          A small number of rows have invalid values outside Brazil's range
          due to dirty source data.
        tests:
          - not_null
      - name: longitude
        description: >
          Average longitude for this zip code prefix.
          A small number of rows have invalid values outside Brazil's range
          due to dirty source data.
        tests:
          - not_null
      - name: city
        description: Representative city name for this zip code prefix.
      - name: state
        description: Two-letter Brazilian state code.
